[package]
name = "fabric-control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fabric-context = { path = "../../core/context" }
fabric-telemetry = { path = "../../core/telemetry" }
fabric-types = { path = "../../core/types" }
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
pbjson-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
# Server backends (ADR 004). Non-optional: this crate IS the Postgres+Valkey
# control plane — there is no stub configuration. The endpoint stays lean by
# never depending on this crate (only its integration tests do, as a
# dev-dependency), not via a feature flag.
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "migrate"] }
fred = { version = "10.1.0", features = ["i-keys", "i-scripts"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }