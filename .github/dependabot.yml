version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for the OTel/tracing stack so versions move together.
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /harness/pi-session-backend
    schedule:
      interval: weekly
