[workspace]
resolver = "2"
members = [
    "core/types",
    "core/telemetry",
    "core/context",
    "core/policy",
    "core/classifier",
    "core/memory",
    "core/runtime",
    "core/tools",
    "core/models",
    "core/inference",
    "enterprise/connectors",
    "enterprise/mdm",
    "enterprise/audit",
    "enterprise/ha",
    "enterprise/catalog",
    "enterprise/admin",
    "endpoint/daemon",
    "endpoint/cli",
    "endpoint/mdm",
    "server/agent",
    "server/control",
    "server/catalog",
    "sdk/fabric-core",
    "sdk/fabric-adapter",
    "sdk/fabric-tools",
    "sdk/fabric-policy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dthaha/agent-fabric"

[workspace.dependencies]
prost = "0.13"
prost-types = "0.13"
pbjson = "0.7"
pbjson-types = "0.7"
regex = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
tokio-util = "0.7"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
kube = { version = "0.98", features = ["derive", "client", "ws"] }
k8s-openapi = { version = "0.24", features = ["v1_31"] }
chrono = { version = "0.4", features = ["serde"] }
http = "1"
hyper = { version = "1", features = ["full"] }
http-body = "1"
plist = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
