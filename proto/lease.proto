syntax = "proto3";

package fabric.lease;

import "context.proto";
import "google/protobuf/timestamp.proto";

// A write lease on a session's context op-log. Exactly one ACTIVE lease per
// session at any time; the holder is the single writer.
message Lease {
  string lease_id = 1;
  string session_id = 2;
  string holder_id = 3;
  fabric.context.Locus locus = 4;
  uint64 granted_seq = 5;
  google.protobuf.Timestamp granted_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  LeaseState state = 8;
  // Server identity that granted the lease. Lease authority is server-side;
  // granted_at is stamped with the server clock, never the client's.
  string granted_by = 9;
  // Surface identity that preempted this lease (latest presence wins), for
  // audit. Preemption is a presence signal, not a timestamp race.
  string preempted_by = 10;
}

enum LeaseState {
  LEASE_STATE_UNSPECIFIED = 0;
  LEASE_STATE_ACTIVE = 1;
  LEASE_STATE_EXPIRED = 2;
  LEASE_STATE_REVOKED = 3;
  LEASE_STATE_TRANSFERRED = 4;
  // Released by the holder at the end of a turn. Leases are turn-scoped:
  // acquired at turn start, released at turn end; the TTL is only a safety
  // net for crashed holders.
  LEASE_STATE_RELEASED = 5;
}

// Request to acquire a fresh write lease for a session. 409 while another
// holder's unexpired lease is active — preemption (presence) is the way to
// take over a live session, never a raw acquire race.
message AcquireLeaseRequest {
  string session_id = 1;
  string holder_id = 2;
  optional fabric.context.Locus locus = 3;
  optional int64 ttl_ms = 4;
}

// Presence-driven preemption: the surface with the latest server-observed
// activity takes the lease.
message PreemptRequest {
  string session_id = 1;
  string new_holder_id = 2;
  string reason = 3;
  optional fabric.context.Locus locus = 4;
  optional int64 ttl_ms = 5;
}

// Request to extend an ACTIVE lease's expiry. Holder must match; the new
// expiry is stamped with the server clock.
message RenewLeaseRequest {
  string lease_id = 1;
  string holder_id = 2;
  optional int64 ttl_ms = 3;
}

// Request to release the lease at the end of a turn. Holder must match.
message ReleaseLeaseRequest {
  string session_id = 1;
  string holder_id = 2;
}

// Query for the session's ACTIVE lease.
message ActiveLeaseRequest {
  string session_id = 1;
}

// A surface reports user activity. Latest server-observed activity wins the
// lease: this IS the preemption mechanism.
message PresenceRequest {
  string session_id = 1;
  string surface_id = 2;
  optional fabric.context.Locus locus = 3;
}

// Offline-reconnect ingest: an endpoint replays its local op-log after an
// offline stretch. Entries merge through the deterministic reconcile path.
message ReplayRequest {
  string session_id = 1;
  repeated fabric.context.ContextEntry entries = 2;
}

// Request to transfer the write lease from one holder to another. Handoff is
// lease transfer + catch-up, never summarize-and-restart.
message HandoffRequest {
  string session_id = 1;
  string from_holder = 2;
  string to_holder = 3;
  uint64 freeze_at_seq = 4;
  string reason = 5;
}

// Acknowledgement of a handoff. The new holder reports the sequence it has
// caught up to before it begins writing.
message HandoffAck {
  string session_id = 1;
  string new_holder = 2;
  uint64 caught_up_to_seq = 3;
  bool success = 4;
  string error = 5;
}
