[package]
name = "fabric-endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fabric-endpoint"
path = "src/main.rs"

[dependencies]
fabric-classifier = { path = "../../core/classifier" }
fabric-context = { path = "../../core/context" }
fabric-policy = { path = "../../core/policy" }
fabric-telemetry = { path = "../../core/telemetry" }
fabric-types = { path = "../../core/types" }
fabric-endpoint-mdm = { path = "../mdm" }
anyhow.workspace = true
axum.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
fabric-control = { path = "../../server/control" }
pbjson-types.workspace = true
tower = { version = "0.5", features = ["util"] }

[features]
default = ["core"]
core = []
enterprise = ["mdm-intune", "mdm-jamf", "audit-siem", "ha-failover", "private-registry"]
mdm-intune = []
mdm-jamf = []
audit-siem = []
ha-failover = []
private-registry = []
